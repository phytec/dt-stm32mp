# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/stm32/stm32mp2-a35td-extdts.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32MP2 A35 Trusted Domain based Platforms

maintainers:
  - Amelie Delaunay <amelie.delaunay@foss.st.com>

properties:
  $nodename:
    const: "/"
  compatible:
    oneOf:
      - $ref: stm32.yaml#/properties/compatible

      - description: ST STM32MP215F-DK A35TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp215f-dk-ca35tdcid-ostl
              - pattern: "^st,stm32mp215f-dk$"
              - pattern: "^st,stm32mp215$"
          - items:
              - const: st,stm32mp215f-dk-ca35tdcid-ostl-m33-examples
              - pattern: "^st,stm32mp215f-dk$"
              - pattern: "^st,stm32mp215$"
          - items:
              - const: st,stm32mp215f-dk-psci-osi
              - pattern: "^st,stm32mp215f-dk$"
              - pattern: "^st,stm32mp215$"

      - description: ST STM32MP235F-EV1 A35TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp235f-ev1-stpmic2l-ca35tdcid-ostl
              - const: st,stm32mp235f-ev1-stpmic2l
              - pattern: "^st,stm32mp235$"

      - description: ST STM32MP235F-DK A35TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp235f-dk-ca35tdcid-ostl-ucsi
              - pattern: "^st,stm32mp235f-dk$"
              - pattern: "^st,stm32mp235$"

      - description: ST STM32MP257F-DK A35TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp257f-dk-ca35tdcid-ostl
              - pattern: "^st,stm32mp257f-dk$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-dk-ca35tdcid-ostl-m33-examples
              - pattern: "^st,stm32mp257f-dk$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-dk-ca35tdcid-ostl-ucsi
              - pattern: "^st,stm32mp257f-dk$"
              - pattern: "^st,stm32mp257$"

      - description: ST STM32MP257F-EV1 A35TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp257f-ev1-ca35tdcid-ostl
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-ev1-ca35tdcid-ostl-m33-examples
              - const: st,stm32mp257f-ev1-ca35tdcid-ostl
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-ev1-ca35tdcid-ostl-m33-examples-sram
              - const: st,stm32mp257f-ev1-ca35tdcid-ostl
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-ev1-ca35tdcid-ostl-ucsi
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-ev1-psci-osi
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-ev1-stpmic2l-ca35tdcid-ostl
              - const: st,stm32mp257f-ev1-stpmic2l
              - pattern: "^st,stm32mp257$"

additionalProperties: true

...
