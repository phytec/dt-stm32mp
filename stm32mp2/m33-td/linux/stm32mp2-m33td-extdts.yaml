# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/stm32/stm32mp2-m33td-extdts.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32MP2 M33 Trusted Domain based Platforms

maintainers:
  - Amelie Delaunay <amelie.delaunay@foss.st.com>

properties:
  $nodename:
    const: "/"
  compatible:
    oneOf:
      - $ref: stm32.yaml#/properties/compatible

      - description: ST STM32MP215F-DK M33TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp215f-dk-cm33tdcid-ostl
              - pattern: "^st,stm32mp215f-dk$"
              - pattern: "^st,stm32mp215$"
          - items:
              - const: st,stm32mp215f-dk-cm33tdcid-ostl-sdcard
              - pattern: "^st,stm32mp215f-dk$"
              - pattern: "^st,stm32mp215$"

      - description: ST STM32MP235F-DK M33TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp235f-dk-cm33tdcid-ostl
              - pattern: "^st,stm32mp235f-dk$"
              - pattern: "^st,stm32mp235$"
          - items:
              - const: st,stm32mp235f-dk-cm33tdcid-ostl-sdcard
              - pattern: "^st,stm32mp235f-dk$"
              - pattern: "^st,stm32mp235$"

      - description: ST STM32MP257F-DK M33TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp257f-dk-cm33tdcid-ostl
              - pattern: "^st,stm32mp257f-dk$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-dk-cm33tdcid-ostl-emmc
              - pattern: "^st,stm32mp257f-dk$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-dk-cm33tdcid-ostl-sdcard
              - pattern: "^st,stm32mp257f-dk$"
              - pattern: "^st,stm32mp257$"

      - description: ST STM32MP257F-EV1 M33TD based Boards
        oneOf:
          - items:
              - const: st,stm32mp257f-ev1-cm33tdcid-ostl
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-ev1-cm33tdcid-ostl-emmc
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-ev1-cm33tdcid-ostl-sdcard
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"
          - items:
              - const: st,stm32mp257f-ev1-cm33tdcid-ostl-snor
              - pattern: "^st,stm32mp257f-ev1$"
              - pattern: "^st,stm32mp257$"

additionalProperties: true

...
